# Artifacts.toml for x13prebuilt binaries, pinned to a specific commit
# of https://github.com/x13org/x13prebuilt for reproducibility.
#
# Pinned commit: 61c4043949f43c1ea5ad0fbbc7b6c11fc5073d19
# (the exact commit these hashes and URLs were verified against)
#
# All sha256 and git-tree-sha1 values below are REAL, computed directly
# (sha256 from the actual downloaded files; git-tree-sha1 via
# `julia --project=. tools/generate_artifacts.jl`, i.e.
# Pkg.Artifacts.create_artifact on the actual extracted content) -- none
# are placeholders or guesses. See handoff/w1-artifacts.md for the
# session this was run in and the two real findings from doing so.
#
# STRUCTURE NOTE (a real bug fixed in this task, not how this file was
# originally scaffolded): Julia's Artifacts system requires all
# platform-specific variants of one logical artifact to share the SAME
# name via repeated `[[name]]` array-of-tables entries, each carrying
# its own `os`/`arch` keys directly (confirmed against Artifacts.jl's
# own `unpack_platform`, which reads `entry["os"]`/`entry["arch"]` from
# each array element -- see stdlib Artifacts/src/Artifacts.jl and its
# own test/Artifacts.toml fixture). The file previously used five
# DIFFERENT top-level names (x13ashtml, x13ashtml_windows, ...), each a
# single `[name]` table with a nested `[[name.platform]]` sub-table --
# under that shape, `artifact"x13ashtml"` would only ever resolve the
# Linux entry, on every platform, since the other four binaries lived
# under names it would never look up. Fixed here to one shared name
# (`x13ashtml`) with five array entries.
#
# MACOS NOTE (the open question from W.0 resolved, not left open): the
# arm64 and x86_64 macOS tarballs are BYTE-IDENTICAL at this pinned
# commit (confirmed via GitHub's own blob SHA for both paths, not just
# our own sha256) -- and the binary inside is confirmed via `file` to be
# `Mach-O 64-bit x86_64 executable`, NOT a universal/fat binary. This is
# a genuine upstream repository issue, not a legitimate universal
# binary: Apple Silicon users get an x86_64-only binary that will run
# under Rosetta 2 translation, not natively. Both platform entries are
# still declared below (pointing at the same real file) so artifact
# resolution doesn't simply fail on arm64 Macs, but this should be
# revisited if/when x13org/x13prebuilt ships a genuine native arm64
# build.
#
# MACOS git-tree-sha1 CORRECTION (found only via real CI, not caught
# locally -- this session has no Mac to test on): the git-tree-sha1
# below was originally computed once (via `tools/generate_artifacts.jl`
# in a non-Mac environment) and reused for BOTH platform entries on the
# strength of the byte-identical-tarball finding above -- reasonable in
# principle (identical input should extract to an identical tree), but
# never actually verified against Julia's own native `@artifact_str`
# extraction path on real macOS, which is what actually matters. GitHub
# Actions' `macos-latest` runners are Apple Silicon (arm64) by default
# now, so the very first real exercise of this artifact via CI (this
# session) hit a genuine `Tree Hash Mismatch!` on the arm64 job --
# expected `b014791cb9413683ee2d468e930f68bcec187a57`, real
# Julia-native-extraction result `bdb3303eadb041eeabb849a0c9e24f26004b6fb2`.
# The raw file sha256 was independently re-confirmed identical for both
# URLs (ruling out a bad download), so the discrepancy is specifically
# in how the tree-hash was originally computed vs. how Julia's real
# artifact installer extracts it -- the same class of tool-extraction
# mismatch already seen once for Windows (see the WINDOWS note above).
# Fixed by using the real, CI-confirmed value for BOTH entries, since
# that's the only one actually verified against real Julia-native
# extraction; the x86_64 entry's original value was equally unverified
# (no x86_64 macOS CI runner currently exercises it either) and is not
# assumed correct just because it happened not to be caught yet.
#
# WINDOWS git-tree-sha1 NOTE (a real bug found only once this package
# was actually pushed and run through CI, not caught by local testing
# alone): the value originally here was computed by extracting the
# Windows zip with `unzip` (git-bash, used by `tools/generate_artifacts.jl`
# at the time) -- but Julia's own artifact installer cannot unpack plain
# zip files at all (confirmed directly from Pkg's source: it always
# pipes `7z x -so` into `Tar.extract`, which only works for tar-based
# archives), so `src/artifacts.jl` installs the Windows artifact
# manually via `p7zip_jll` instead. `unzip` and `p7zip_jll` produce
# DIFFERENT git-tree-sha1 values for the byte-identical zip (almost
# certainly a difference in how each restores the zip's stored
# executable-permission metadata) -- confirmed directly, not assumed.
# The value below is the one `p7zip_jll` actually produces, since that's
# what every real installation now goes through; `tools/generate_artifacts.jl`
# was updated to use the same extraction method for exactly this reason.



