name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # TSAnalytics.jl isn't registered (see CI.yml's own comment on the
      # identical step for the full explanation) -- SeasonalAdjustment
      # depends on it transitively, so the docs environment needs the
      # same develop step before it can instantiate.
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(url="https://github.com/MSALabs/TSAnalytics.jl"); Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
